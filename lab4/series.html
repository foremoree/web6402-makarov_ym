<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDBpochti — Сериалы</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header-bar">
        <h1 class="header-bar__title">IMDBpochti</h1>
        <nav class="header-bar__nav">
            <a class="header-bar__link" href="index.html">Главная</a>
            <a class="header-bar__link" href="movies.html">Фильмы</a>
            <a class="header-bar__link header-bar__link--active" href="series.html">Сериалы</a>
            <a class="header-bar__link" href="rating.html">Рейтинг</a>
            <a class="header-bar__link" href="login.html">Вход</a>
        </nav>
    </header>

    <main class="content-area">

        <h2>Сериалы, от которых не оторваться</h2>

        <div class="film-list film-list--grid">

            <article class="film-card" style="--i: 0">
                <img class="film-card__poster" src="images/poster-breaking-bad.jpg" width="180" height="270" alt="Постер сериала Во все тяжкие">
                <h3 class="film-card__title">Во все тяжкие</h3>
                <p><span class="film-card__year">2008</span> · <span class="film-card__genre">Драма</span></p>
                <p class="film-card__score">Оценка: <strong>9.5</strong></p>
            </article>

            <article class="film-card" style="--i: 1">
                <img class="film-card__poster" src="images/poster-game-of-thrones.jpg" width="180" height="270" alt="Постер сериала Игра престолов">
                <h3 class="film-card__title">Игра престолов</h3>
                <p><span class="film-card__year">2011</span> · <span class="film-card__genre">Фэнтези</span></p>
                <p class="film-card__score">Оценка: <strong>9.2</strong></p>
            </article>

            <article class="film-card" style="--i: 2">
                <img class="film-card__poster" src="images/poster-stranger-things.jpg" width="180" height="270" alt="Постер сериала Очень странные дела">
                <h3 class="film-card__title">Очень странные дела</h3>
                <p><span class="film-card__year">2016</span> · <span class="film-card__genre">Фантастика</span></p>
                <p class="film-card__score">Оценка: <strong>8.7</strong></p>
            </article>

        </div>

        <p><a href="index.html">Назад на главную</a></p>

    </main>

</body>
</html>
